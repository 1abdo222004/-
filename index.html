<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>💸 Earn App</title>

<!-- Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ✅ Monetag SDK -->
<script src='//libtl.com/sdk.js'
        data-zone='10602007'
        data-sdk='show_10602007'></script>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#0f172a;
    color:white;
    text-align:center;
}

.container{
    padding:25px;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    margin-top:25px;
}

h1{
    font-size:26px;
    margin-bottom:20px;
}

.stat{
    font-size:18px;
    margin:8px 0;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:14px;
    font-size:18px;
    background:#22c55e;
    color:white;
    margin-top:18px;
}

button:disabled{
    background:gray;
}
</style>
</head>


<body>
<div class="container">

<h1>💸 تطبيق الربح من الإعلانات</h1>

<div class="card">
    <div class="stat">⭐ النقاط: <b id="points">0</b></div>
    <div class="stat">🎬 الإعلانات المكتملة: <b id="ads">0</b></div>

    <button id="adBtn" onclick="watchAd()">
        🎬 شاهد إعلان واربح 10 نقاط
    </button>
</div>

</div>


<script>
/* =========================
   Telegram Init
========================= */
const tg = window.Telegram.WebApp;
tg.expand();


/* =========================
   Storage
========================= */
let points = parseInt(localStorage.getItem("points") || 0);
let ads = parseInt(localStorage.getItem("ads") || 0);

const btn = document.getElementById("adBtn");

updateUI();


/* =========================
   UI
========================= */
function updateUI(){
    document.getElementById("points").innerText = points;
    document.getElementById("ads").innerText = ads;
}


/* =========================
   Reward System
========================= */
function rewardUser(){
    points += 10;
    ads += 1;

    localStorage.setItem("points", points);
    localStorage.setItem("ads", ads);

    updateUI();
}


/* =========================
   Anti Spam Cooldown
========================= */
let cooldown = false;
const WAIT_TIME = 30; // ثانية


/* =========================
   Watch Ad
========================= */
async function watchAd(){

    if(cooldown){
        alert("⏳ انتظر " + WAIT_TIME + " ثانية قبل إعلان جديد");
        return;
    }

    cooldown = true;

    btn.disabled = true;
    btn.innerText = "⏳ جاري عرض الإعلان...";

    try {

        /* ✅ يدخل هنا فقط عند إكمال الإعلان بالكامل */
        await show_10602007();

        rewardUser();

        alert("✅ تم إكمال الإعلان +10 نقاط");

    } catch(e) {

        /* ❌ أغلق الإعلان → لا نقاط */
        alert("❌ لم تكمل الإعلان، لا توجد مكافأة");

    }

    setTimeout(()=>{
        cooldown = false;
        btn.disabled = false;
        btn.innerText = "🎬 شاهد إعلان واربح 10 نقاط";
    }, WAIT_TIME * 1000);
}
</script>

</body>
</html>
